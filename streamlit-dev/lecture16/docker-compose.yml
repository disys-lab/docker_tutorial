# Lecture 16 example: text, tables, metrics and the built-in charts.
#
#   cd lecture16 && docker compose up -d
#   open http://localhost:8503
#
# No database is needed; the app reads the warehouse CSVs directly.

services:
  streamlit:
    image: ghcr.io/disys-lab/streamlit-base:latest
    container_name: streamlit-lecture16
    restart: always
    ports:
      - "8503:8501"
    volumes:
      - ./app:/usr/src/app/app
      - ../../mysql-dev/data:/usr/src/app/data:ro
    command: >
      streamlit run app/basics.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
