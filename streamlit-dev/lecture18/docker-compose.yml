# Lecture 18 example: the warehouse dashboard, Streamlit in front of MySQL
# and Redis.
#
#   cd lecture18
#   docker compose up -d
#   open http://localhost:8505
#
# The first page you see offers a button to load the data into MySQL and Redis.
#
# lecture16/ and lecture17/ hold smaller examples that run the same base
# image with a different command.

services:
  mysql:
    image: mysql:latest
    container_name: streamlit-mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: OSUGoPokes
      MYSQL_DATABASE: iem4723_streamlit
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pOSUGoPokes"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    container_name: streamlit-redis-container
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  streamlit:
    image: ghcr.io/disys-lab/streamlit-base:latest
    container_name: streamlit-lecture18
    restart: always
    ports:
      - "8505:8501"
    volumes:
      - ./app:/usr/src/app/app
      - ../../mysql-dev/data:/usr/src/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      streamlit run app/main.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true

volumes:
  mysql-data:
  redis-data:
