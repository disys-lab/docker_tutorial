# Lecture 17 example: widgets, layout, session state and forms.
#
#   cd lecture17 && docker compose up -d
#   open http://localhost:8504
#
# No database is needed; the app reads the warehouse CSVs directly.

services:
  streamlit:
    image: ghcr.io/disys-lab/streamlit-base:latest
    container_name: streamlit-lecture17
    restart: always
    ports:
      - "8504:8501"
    volumes:
      - ./app:/usr/src/app/app
      - ../../mysql-dev/data:/usr/src/app/data:ro
    command: >
      streamlit run app/widgets.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
