# Q2. Start it from inside this folder:
#
#   docker compose up -d
#   open http://localhost:8513
#
# Stop it again with: docker compose down

services:
  streamlit:
    image: ghcr.io/disys-lab/streamlit-base:latest
    container_name: assignment4-q2
    restart: always
    ports:
      - "8513:8501"
    volumes:
      - ./app:/usr/src/app/app
      - ../data:/usr/src/app/data:ro
    command: >
      streamlit run app/main.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
